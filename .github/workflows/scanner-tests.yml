name: Scanner tests
on:
  pull_request:
  push:
    branches: [main, feature/paper-v2-shadow-risk]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check scanner/service.mjs
