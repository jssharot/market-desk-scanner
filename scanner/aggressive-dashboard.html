<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Desk — Aggressive Lab</title><style>body{background:#10151d;color:#e6edf6;font:15px system-ui;margin:0;padding:24px}main{max-width:1080px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:26px}section{background:#1b2430;border:1px solid #334153;border-radius:14px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.metric{background:#111923;padding:16px;border-radius:10px}.metric strong{display:block;font-size:22px;margin-top:8px}input,button{background:#27384c;color:white;border:1px solid #52657a;border-radius:8px;padding:10px}button{cursor:pointer}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;border-bottom:1px solid #344255;padding:9px}small{color:#9caec4}.scroll{overflow-x:auto}.status{color:#e2b668}</style><main><header><div><h1>Aggressive Options Lab</h1><small>Paper simulations only — no brokerage orders</small></div><a href="/paper-v2/dashboard" style="color:#9bc5ff">Paper V2</a></header><section><label>Scanner access key <input id="key" type="password" autocomplete="off" placeholder="Paste key"></label> <button id="load">Refresh</button><p id="status" class="status">Enter your access key to load paper data. The key stays in this tab.</p></section><div id="panels"></div></main><script>
const key=document.getElementById('key'),status=document.getElementById('status'),panels=document.getElementById('panels');
const esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=x=>Number.isFinite(x)?'$'+x.toFixed(2):'—',pct=x=>Number.isFinite(x)?(x*100).toFixed(1)+'%':'—';
function panel(title,m,rows){return '<section><h2>'+title+'</h2><div class="grid">'+[['Net P&L',money(m.pnl)],['Win rate',pct(m.winRate)],['Profit factor',m.profitFactor?.toFixed(2)??'—'],['Max drawdown',money(m.maxDrawdown)],['Closed trades',m.closed],['Open trades',m.open]].map(([k,v])=>'<div class="metric"><small>'+k+'</small><strong>'+esc(v)+'</strong></div>').join('')+'</div><h3>Paper journal</h3><div class="scroll"><table><thead><tr><th>Opened</th><th>Underlying</th><th>Contract</th><th>Status</th><th>P&L</th><th>Exit reason</th></tr></thead><tbody>'+rows.slice().reverse().slice(0,100).map(p=>'<tr><td>'+esc(p.openedAt)+'</td><td>'+esc(p.symbol)+'</td><td>'+esc(p.contractSymbol)+'</td><td>'+esc(p.status)+'</td><td>'+esc(money(p.pnl))+'</td><td>'+esc(p.exitReason)+'</td></tr>').join('')+'</tbody></table></div></section>'}
document.getElementById('load').onclick=async()=>{try{const r=await fetch('/aggressive-lab/state',{headers:{Authorization:'Bearer '+key.value}});if(!r.ok)throw Error('Access denied or server unavailable ('+r.status+')');const x=await r.json();status.textContent=x.enabled?'Paper scanner enabled':'Scanner disabled — read-only dashboard';panels.innerHTML=panel('Aggressive Momentum',x.momentum,x.journal.filter(p=>p.strategy==='momentum'))+panel('Speculative Home Runs',x.homeRun,x.journal.filter(p=>p.strategy==='home_run'));}catch(e){status.textContent=e.message;panels.textContent=''}};</script></html>
